spring.application.name=student-management

server.port=8080

# --- Database Configuration ---
# # Option 1: MySQL (Ensure MySQL80 service is started)
# spring.datasource.url=jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=Akhil@123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Option 2: Embedded H2 Database (Uncomment below if MySQL service is stopped)
spring.datasource.url=jdbc:h2:file:../data/studentdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# EMAIL 2-STEP VERIFICATION CONFIGURATION
# (Gmail SMTP with 16-Character App Password)
# ==========================================
# To send real emails via Gmail:
# 1. Enable "2-Step Verification" in your Google Account (myaccount.google.com/security)
# 2. Generate a 16-character "App Password" (myaccount.google.com/apppasswords)
# 3. Enter your Gmail and the 16-character App Password below (without spaces):
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dev mode: whether to log verification codes clearly to backend console & API response
app.verification.dev-mode=true
app.verification.code-length=6
app.verification.code-expiry-minutes=10